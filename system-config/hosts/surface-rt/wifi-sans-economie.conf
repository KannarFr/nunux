# Pas d'économie d'énergie Wi-Fi (2 = désactivée) : le 2026-11-26 à 11:03, le firmware mwifiex (ps_mode=1)
# a cessé de répondre (« Timeout cmd id = 0xa4 », « FW is in bad state ») et le pilote s'est bloqué en le
# réinitialisant ; plus de réseau jusqu'au redémarrage. Branchée en permanence : la batterie n'y perd rien.
[connection]
wifi.powersave = 2
