#!/usr/bin/nft -f
# Host firewall: drop unsolicited inbound, on every interface (wifi, eno1, …).
# Live at /etc/nftables.conf, loaded by nftables.service.
#
# Deliberately NOT Arch's stock file, which is wrong for a docker host twice:
#   - it opens with `flush ruleset`, which also deletes docker's own tables
#     (iptables-nft), so every (re)load cuts containers off until docker restarts;
#   - its forward chain is `policy drop`, and a drop at the forward hook in *any*
#     table wins, so container traffic dies even though docker's table accepts it.
# So this file owns exactly one table and has no forward chain. Docker-published
# ports never reach this chain anyway (DNAT sends them through forward) — they are
# kept off the LAN by /etc/docker/daemon.json instead, which takes two settings:
# "ip" covers only the default bridge, and "default-network-opts" covers the
# user-defined networks every compose project creates.

# create-then-delete makes reloads idempotent without touching other tables
table inet host_filter
delete table inet host_filter

table inet host_filter {
	chain input {
		type filter hook input priority filter; policy drop;

		ct state invalid drop
		ct state { established, related } accept
		iif lo accept

		# containers reaching services on the host (host.docker.internal, …)
		iifname "docker0" accept
		iifname "br-*" accept

		# ICMP is needed for PMTU discovery; ICMPv6 also carries NDP/router ads
		meta l4proto { icmp, ipv6-icmp } accept

		# DHCPv6 replies come from the server's link-local address to a request
		# that was multicast, so conntrack can't match them
		ip6 saddr fe80::/10 udp dport dhcpv6-client accept

		# mDNS answers (printers, .local names) — resolved queries, peers reply
		udp dport mdns accept

		tcp dport ssh accept

		# VBAN audio receptor (vban-receptor.service) — uncomment when using it
		# udp dport 6980 accept
	}
}
