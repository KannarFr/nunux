# zram is the only swap device on this host (no disk swapfile since
# 2026-09-22), so the zram-only tuning applies.

# Swap-in readahead, as 2^n pages per fault. 0 = one page: readahead only
# pays off on a seeking device, and on zram every extra page costs a zstd
# decompression — the default of 3 decompresses 8 pages to satisfy 1.
vm.page-cluster = 0

# >100 tells reclaim that swapping anon pages out is cheaper than dropping
# page cache, which is true when the "swap" is compressed RAM. 180 is the
# usual zram-only value (Fedora / ArchWiki).
vm.swappiness = 180
