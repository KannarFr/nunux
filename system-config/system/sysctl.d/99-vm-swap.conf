# Swap-in readahead, as 2^n pages per fault. The default of 3 (8 pages) is
# wasteful for zram, where every page read costs a zstd decompression —
# 8 pages decompressed to satisfy 1.
#
# But this knob is GLOBAL, not per-device, and it also governs
# /swap/swapfile. That swapfile only sees traffic once zram (pri=100) is
# full — i.e. exactly during the deep-pressure phase this whole change set
# exists to survive — and there, 0 would mean single 4 KiB reads and ~8x the
# IO round-trips to fault a working set back in. So: 1 (2 pages) as the
# compromise. Most of the zram win, without crippling the disk path.
vm.page-cluster = 1

# Deliberately NOT setting vm.swappiness. The zram-only guidance (180) does
# not apply now that /swap/swapfile exists at pri=10 — it would push pages
# to disk far too eagerly. The default of 60 is the right call for a mixed
# zram + disk setup.
