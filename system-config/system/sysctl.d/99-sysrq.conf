# SysRq: default on Arch is 16 (sync only), which leaves no way out of a
# memory livelock except cutting power. 244 = 4 (unraw keyboard) + 16 (sync)
# + 32 (remount read-only) + 64 (signal processes) + 128 (reboot).
#
# 64 is the one that matters: Alt+SysRq+F makes the kernel OOM-kill the
# biggest hog. The rest gives you REISUB for a clean-ish emergency reboot.
# Deliberately omits 2 (console loglevel) and 8 (process debug dumps).
kernel.sysrq = 244
