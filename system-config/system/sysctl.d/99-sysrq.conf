# SysRq: default on Arch is 16 (sync only), which leaves no way out of a
# memory livelock except cutting power. 252 = 4 (unraw keyboard) + 8 (debug
# dumps) + 16 (sync) + 32 (remount read-only) + 64 (signal processes)
# + 128 (reboot).
#
# 64 is the one that matters for a livelock: Alt+SysRq+F makes the kernel
# OOM-kill the biggest hog. The rest gives you REISUB for a clean-ish
# emergency reboot.
#
# 8 was added 2026-07-29 after a hard freeze that left *nothing* in the
# journal (see 99-lockup-panic.conf). It enables the diagnostic dumps:
#   Alt+SysRq+W  dump tasks blocked in D-state  <- start here
#   Alt+SysRq+L  backtrace all CPUs
#   Alt+SysRq+T  dump every task
# If the kernel is alive enough to answer the keyboard, these write the
# diagnosis into the journal before you reset. Without bit 8 those keys are
# silently ignored, so 244 made the freeze unattributable.
#
# Deliberately omits 2 (console loglevel).
kernel.sysrq = 252
