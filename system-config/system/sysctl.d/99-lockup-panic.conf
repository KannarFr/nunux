# Lockup capture. Added 2026-07-29 after four consecutive boots ended in a hard
# freeze with no shutdown sequence and no diagnostic trace at all. Updated
# 2026-07-30 after a fifth. Use absolute dates here, not `journalctl -b -N`
# offsets -- those shift every reboot and the original version of this comment
# went stale within a day.
#
# Updated 2026-08-07: the list below was incomplete, because "no shutdown
# sequence in the journal" is a bad detector. The reliable one is btrfs
# replaying its log tree on the FOLLOWING boot, which only happens after an
# unclean unmount:
#     journalctl -k -b <next> | grep 'start tree-log replay'
# That marker reproduces every incident already known here and found two more.
#
#   froze  Jul 27 23:37:41   kernel 7.1.3-arch2-1   (after a 9-day uptime)
#   froze  Jul 28 14:11:28   kernel 7.1.4-arch1-1
#   froze  Jul 28 17:39:25   kernel 7.1.4-arch1-1
#   froze  Jul 29 17:07:07   kernel 7.1.4-arch1-1
#   clean  Jul 29 18:48:35   kernel 7.1.5-arch1-2   (deliberate reboot)
#   froze  Jul 30 13:01:40   kernel 7.1.5-arch1-2
#   froze  Jul 30 23:56:43   kernel 7.1.5-arch1-2   (found 08-07)
#   clean  Jul 31 19:12:11   kernel 7.1.5-arch1-2
#   HUNG   Aug 05 06:18:01   kernel 7.1.5-arch1-2   suspend, NOT this bug (below)
#   ?????  Aug 05 20:20:10   kernel 7.1.5-arch1-2   unattributable, see note
#   ?????  Aug 06 15:32:57   kernel 7.1.5-arch1-2   unattributable, see note
#   ?????  Aug 06 20:28:59   kernel 7.1.5-arch1-2   unattributable, see note
#   froze  Aug 06 21:17:56   kernel 7.1.5-arch1-2
#   clean  Aug 07 12:05:06   kernel 7.1.5-arch1-2   (deliberate, journald fix)
#   froze  Aug 07 14:16:12   kernel 7.1.5-arch1-2   no pstore record, see below
#   ----   Aug 07 14:17:50   kernel 7.1.6-arch1-1   first boot with dcdebugmask
#
# The three "unattributable" ones fall inside the 08-05 20:21 -> 08-07 12:05
# journald blackout (see systemd/journald.conf.d/retention.conf): PID 1 was not
# logging at all, so neither the absence of a shutdown sequence nor the silence
# of sway-watchdog means anything for those boots. Do not count them as
# evidence in either direction.
#
# Aug 05 06:18:01 is a DIFFERENT failure and should not be lumped in: that boot
# died 6s into a suspend, having never reached `PM: suspend entry`. It hung in
# the pre-suspend hooks with user.slice already frozen -- which from the outside
# looks exactly like a hard freeze. The blocker was
# /usr/lib/systemd/system-sleep/qsync_sleep_notification (AUR `qsync`), waiting
# 5s on a QNAP service that was not running. That hook is also a local root
# hole: it and /usr/local/bin/QNAP/QsyncClient/systemdEventNotifier.sh run as
# root on every suspend and are both mode 775 owned by kannar:kannar.
#
# Spans four kernel versions, so it is not a regression introduced by any one
# `pacman -Syu`. In every case the journal stops mid-line during ordinary
# activity, and until 2026-08-07 nothing else was ever found there: no panic,
# no soft/hard lockup, no hung task, no MCE, no NVMe or btrfs I/O error, no
# amdgpu reset or ring timeout, no PCIe AER.
#
# That was a limitation of looking only at the journal. It IS a hard lockup
# panic; the journal cannot contain it because the panic happens with the CPU
# already wedged, so nothing gets flushed to disk. See CONFIRMED below.
#
# Not OOM, and this keeps needing to be re-established, so: earlyoom's last
# report before the Jul 30 freeze (12 min prior) had 75.64% memory available
# and swap 92.70% free, and no oom-killer ran at any point in that boot. This
# is NOT the 2026-07-28 memory livelock the zram/swapfile/earlyoom stack was
# built for. Check `journalctl -b -1 | grep -i oom-killer` before assuming.
#
# Not *caused by* the chronic eDP-1 page-flip/atomic-commit-EBUSY storms, and
# as of 2026-08-07 this is measured rather than assumed. Comparing the last
# 10min before each freeze against the preceding 50min, the rate FALLS going
# into the freeze in four of six (16.2->4.4, 47.5->4.0, 9.3->1.4, 24.4->0.1
# per min), and the Jul 30 13:01 freeze had exactly zero in its final 10min.
# Every boot appears to "end on" one purely because they are the most frequent
# line in the log.
#
# Docker teardown / btrfs overlayfs churn: DEAD LEAD, keep only so nobody
# re-derives it. The last lines before the incidents are docker teardown, a
# libvulkan_radeon coredump, waybar GTK assertions and gpg-agent card polling --
# four unrelated things, which argued for something asynchronous underneath.
# It was: the display engine. The pstore dump's own preamble is 20+ parts of
# docker veth churn simply because that is what fills this host's ring buffer.
# Same trap as the eDP-1 storm above -- frequency mistaken for relevance.
#
# Same verdict on snapper-cleanup, noticed 2026-08-07 because it ran 60s before
# the Aug 07 freeze and 89s before Jul 30 13:01 (cleanups are ~hourly, so ~2.6%
# each by chance). Suggestive, and wrong: the diagnosed panic has no btrfs
# frame anywhere in it. Recorded here as a caution about post-hoc correlation
# hunting across a handful of incidents, not as an open lead.
#
# CONFIRMED 2026-08-07: amdgpu DCN 3.5 idle power states (DMUB IPS wedge).
#
# Not inferred -- read off an actual panic. The Aug 06 20:28:59 freeze wrote a
# 23-part dmesg record to EFI variable storage, archived by systemd-pstore on
# the next boot into /var/lib/systemd/pstore/1786040975/ (see dmesg.txt there;
# it is the only crash artifact this host has ever produced). The panic:
#
#   watchdog: CPU16: Watchdog detected hard LOCKUP on cpu 16
#   Kernel panic - not syncing: Hard LOCKUP
#   CPU: 16 PID: 1069683 Comm: kworker/u97:5   7.1.5-arch1-2
#   Workqueue: events_unbound commit_work
#
# The stuck task, innermost frame last:
#
#   commit_tail / amdgpu_dm_atomic_commit_tail
#     drm_vblank_get -> drm_vblank_enable -> drm_update_vblank_count
#       amdgpu_crtc_get_scanout_position -> dm_crtc_get_scanoutpos
#         optc1_get_position -> generic_reg_get2 -> dm_read_reg_func
#           dc_allow_idle_optimizations_internal        <-- reg read exits IPS
#             dcn35_apply_idle_power_optimizations
#               dc_dmub_srv_apply_idle_power_optimizations
#                 dc_dmub_srv_notify_idle
#                   dmub_srv_wait_for_idle
#                     delay_halt                        <-- spins forever
#
# Read that as: an atomic commit reads a display register; the register read
# path notices IPS is active and has to bring DMUB out of idle first; DMUB
# never reports idle; the busy-wait never terminates; 10s later the NMI
# watchdog fires. The CPU never returns from delay_halt, which is why the
# journal stops mid-line -- there is nothing left to flush it.
#
# The non-fatal WARNING at dc_dmub_srv.c:1705 seen during ordinary use is the
# same function surviving the same condition. Same bug, luckier timing. And the
# bottom of both traces is the atomic-commit path of the chronic eDP-1 EBUSY
# storm, so the storm, the warning and the freezes are one subsystem.
#
# DMUB-idle bugs on DCN 3.5 are a known family upstream (AMD shipped DMCUB
# firmware updates for 3.5.0/3.5.1 aimed at screen freezes, and there are older
# "exit idle optimizations before accessing HW" fixes in the same area), but as
# of 2026-08-07 I have NOT found an existing report matching this exact trace.
# Both trackers (bugzilla.kernel.org, gitlab.freedesktop.org/drm/amd) sit behind
# Anubis and cannot be searched non-interactively -- search them by hand before
# citing a bug number here. An earlier revision of this file cited kernel
# bugzilla 220218; that was never verified, so do not trust it.
#
# Fixed here by `amdgpu.dcdebugmask=0x800` (DC_DISABLE_IPS, verified
# against drivers/gpu/drm/amd/include/amd_shared.h) in
# system-config/system/kernel/cmdline -- it disables the exact code path that
# wedges. Live since the Aug 07 14:17:50 boot; confirm with
# `cat /sys/module/amdgpu/parameters/dcdebugmask` (want 2048). Reversible: the
# systemd-boot entry "arch-linux-prev" is the same kernel without it.
#
# Caveat, so this is not over-read: the Aug 07 14:16:12 freeze produced NO
# pstore record (/sys/fs/pstore was empty on the next boot, and efivarfs is
# only 33% full so it was not a space problem). sway-watchdog was running and
# wrote no dump either, so the compositor was answering IPC to the end and the
# kernel went down with it. Consistent with the same bug but not proof of it:
# only Aug 06 20:28:59 is actually diagnosed. If freezes continue now that IPS
# is off, that boot is the one to re-examine, not this diagnosis.
#
# Secondary signal to keep watching: `journalctl -b 0 | grep -c 'Page-flip
# failed'` should drop sharply if the storm shared this root cause.

# Hard lockup = a CPU stopped answering the NMI watchdog for 10s. That is
# never recoverable and never a false positive, so panic on it.
#
# 2026-07-30: this was live for the Jul 30 freeze and did NOT fire. So either
# the failure is not a hard lockup, or the NMI watchdog went down with it.
# Keep it -- it costs nothing and rules out one whole class -- but stop
# expecting it to be the thing that catches this.
#
# 2026-08-07: it DID fire, on Aug 06 20:28:59, and that panic is what finally
# identified the bug (see above). Disregard the paragraph above: this setting
# plus efi_pstore is the pair that cracked it. What misled me was reading only
# the journal, which by construction cannot contain a hard-lockup panic --
# the record went to pstore, and I had not looked there. Look there first.
#
# It did not fire on Jul 30 or Aug 07 14:16, so it is not caught every time.
# Absence still proves nothing; presence proves a lot.
kernel.hardlockup_panic = 1

# Soft lockup = a task hogged a CPU >20s without scheduling. Deliberately
# left OFF: heavy docker churn and btrfs commits on this host can stall long
# enough to trip it, and a spurious panic-reboot is worse than the freeze it
# is meant to diagnose. Flip to 1 only for a deliberate debugging window.
kernel.softlockup_panic = 0

# Same reasoning for hung tasks (D-state > hung_task_timeout_secs=120).
# btrfs under load hits this legitimately. Logged, not fatal.
kernel.hung_task_panic = 0

# panic = 0 means "halt at the panic screen and stay there" rather than
# auto-reboot. Deliberate: it keeps the backtrace on screen to photograph.
# The catch is that this host has a chronically unhappy eDP pipeline, so the
# console may not be visible -- which is why the trace also needs to survive
# the reset.
#
# 2026-07-30: that pstore caveat was real. `efi_pstore` is builtin but its
# pstore_disable parameter defaulted to Y, so NO backend was ever registered
# ("pstore: Registered ... as persistent store backend" appears in no boot)
# and /sys/fs/pstore was an empty mount over nothing. A panic would have left
# zero behind. Fixed by adding `efi_pstore.pstore_disable=0` to
# /etc/kernel/cmdline (see system-config/system/kernel/cmdline) and enabling
# systemd-pstore.service to archive into /var/lib/systemd/pstore.
#
# Verify after any kernel or firmware change -- efi-pstore depends on the
# firmware exposing writable variable storage, and AMI firmwares are erratic
# about it:
#   journalctl -k | grep 'persistent store'     # want a "Registered" line
#   sudo ls /sys/fs/pstore/
# If it stops registering, the fallback is ramoops over a memmap-reserved
# region, which is fiddlier but does not involve the firmware at all.
#
# Leaving panic=0 (halt, don't reboot) is still correct with pstore working:
# efi-pstore writes at panic time, so the record survives even the forced
# power-off that halting requires. Set a positive value (e.g. 30) to
# auto-reboot instead.
#
# 2026-08-07: proven end to end. The Aug 06 panic halted here (which is why it
# looked like yet another silent freeze and got a hard power-off), and the
# 23-part dmesg record still survived into EFI variable storage. This is also
# why a freeze that leaves NO pstore record is a real distinction worth
# noticing rather than a logging failure -- check /sys/fs/pstore and
# /var/lib/systemd/pstore (both root-only) after every incident, first.
kernel.panic = 0
