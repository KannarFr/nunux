# Added 2026-07-30, fifth abrupt freeze. See 99-lockup-panic.conf for the
# incident history.
#
# journald batches writes to persistent storage and only fsyncs every
# SyncIntervalSec (default 5min). Messages at LOG_ERR and above are synced
# immediately, everything below just sits in the write cache -- so on a box
# that wedges without a shutdown, up to five minutes of the run-up to the
# freeze is simply lost. That run-up is exactly what is missing from every
# incident so far: the journal ends mid-normal-activity with no error, which
# is consistent both with "nothing was wrong" and with "the warning did get
# logged and never reached the disk". Cannot tell those apart at 5min.
#
# 10s trades a small amount of extra I/O for being able to.
[Journal]
SyncIntervalSec=10s
