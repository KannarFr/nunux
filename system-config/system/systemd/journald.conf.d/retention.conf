[Journal]
Storage=persistent
# Raised from 1G on 2026-08-07. Two reasons, neither of them "we want more logs".
#
# The directory holds ~712M, of which ~400M is .journal~ files -- journals
# journald renamed after finding them corrupt. Those are still *readable*, and
# for the 2026-08-05..08-07 blackout they are the only surviving record of
# three boots, so they must not be vacuumed away. They count against
# SystemMaxUse like any other file, and at 1G the incident history was one
# busy week away from being deleted to make room.
#
# Second, vacuum pressure is itself a risk here: every vacuum is another
# rename/unlink cycle against the file journald is actively mmap-writing, on a
# filesystem that has already corrupted it 15 times.
#
# 4G of a 299G-free volume. MaxRetentionSec is the real retention knob.
SystemMaxUse=4G
MaxRetentionSec=3month
