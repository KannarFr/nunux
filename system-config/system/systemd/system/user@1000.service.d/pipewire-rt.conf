# Let PipeWire take the priority it already asks for (module-rt: nice -11,
# SCHED_FIFO 88 on its data loops) without rtkit. rtkit was tried on
# 2026-10-16 and removed: it caps RLIMIT_RTTIME at 200 ms and the kernel
# silently SIGKILLed pipewire twice under build load. Without rtkit, module-rt
# raises its own threads through these rlimits and leaves RLIMIT_RTTIME
# unlimited (rt.time.soft/hard = -1).
# A drop-in on the user manager rather than limits.d: kannar lingers, so
# user@1000 never goes through a new PAM session on re-login. Applies when the
# user manager restarts, i.e. at the next boot. LimitNICE=31 means nice -11.
# Check: ps -L -o tid,cls,rtprio,ni,comm -p $(pgrep -x pipewire)
[Service]
LimitRTPRIO=88
LimitNICE=31
