# docker.slice's cgroup-parent only relocates CONTAINER scopes. The BuildKit
# instance embedded in dockerd (the default `docker` buildx driver) is part
# of dockerd itself, so its memory is charged here, to
# system.slice/docker.service — entirely outside docker.slice and its caps.
# A large multi-stage `docker build` was therefore still able to take the
# machine down with docker.slice sitting near idle.
#
# MemoryHigh only: this throttles and forces reclaim, but never kills.
# Deliberately no MemoryMax — OOM-killing dockerd would take every running
# container with it, which is worse than the problem being solved.
#
# For a build that genuinely needs more, use a builder that runs as a real
# container and is therefore covered by docker.slice instead:
#   docker buildx create --driver docker-container --use
[Service]
MemoryHigh=24G
