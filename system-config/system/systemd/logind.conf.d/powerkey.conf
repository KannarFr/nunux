# Power button: short press does nothing, long press powers off.
#
# Default is HandlePowerKey=poweroff, i.e. a single accidental tap begins a
# real shutdown. Wanted: only a deliberate hold, or an explicit `shutdown now`.
[Login]
HandlePowerKey=ignore

# systemd's own long-press handler, so this is still a *clean* shutdown -- the
# same thing `poweroff` does, not a power cut.
#
# Caveat worth knowing: the firmware also implements a forced power-off on a
# long hold (typically ~4s on this class of machine), and systemd's long-press
# threshold is in the same range. If the firmware wins the race you get a hard
# cut instead of a clean shutdown. That is still the right outcome for "hold
# the power button", it just is not a graceful one -- so for a normal shutdown
# prefer $mod+Escape (bin/powermenu) or `systemctl poweroff`.
HandlePowerKeyLongPress=poweroff

# Note: this only governs logind's handling. Nothing in config/sway/config
# binds XF86PowerOff, so logind has sole ownership of the key.
