[zram0]
# 32G, not 64G. zram's backing store IS RAM: worst case (incompressible
# pages) 1G of zram costs 1G of RAM, so a 64G zram on a 124.9 GiB box can
# eat half of physical memory while the kernel still counts it as free
# swap. That gap is the livelock. 32G caps the worst case at ~25% of RAM.
# This is the ONLY swap device — the disk swapfile was removed 2026-09-22;
# past 32G, earlyoom decides instead of the disk.
zram-size = 32768
compression-algorithm = zstd
