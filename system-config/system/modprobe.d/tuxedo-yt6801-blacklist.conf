# Shadows /usr/lib/modprobe.d/tuxedo-yt6801-blacklist.conf (tuxedo-yt6801-dkms-git),
# which blacklists the in-tree dwmac-motorcomm so its own DKMS module binds instead.
#
# Inverted on 2026-08-20: the DKMS yt6801 v1.0.31 wedges its TX queue on this host --
# link negotiates at 1000, NETDEV WATCHDOG fires ~5s later, "tx timeout, device
# restarting", carrier drops, repeat every ~10s. ARP for the gateway never completes.
# Worse, a lease grabbed in one of the up windows installs a default route at metric
# 1024 (20-wired.network sets none), beating wlan0's 2048 -- so the dead NIC blackholes
# all traffic, wifi included.
#
# Deliberately NOT "blacklist dwmac-motorcomm": we want the upstream driver to bind.
blacklist yt6801
