# USBGuard rules that travel between machines. Live at /etc/usbguard/rules.d/
# (mode 0600, root — usbguard refuses anything looser). The per-host allowlist
# of built-in devices lives in /etc/usbguard/rules.conf, generated on each box
# by `usbguard generate-policy` and deliberately NOT tracked.
#
# Personal devices are pinned by descriptor hash + interface set, with no
# port/parent-hash, so they work in any port or dock on any host. Neither
# device below reports a USB serial, so the hash is the only strong anchor —
# id+name alone is exactly what a BadUSB would spoof. Add one with:
#   usbguard list-devices --blocked   # copy its hash + with-interface

# BadUSB fingerprints: keyboard/HID combined with storage, CDC network, or
# wireless — no legitimate device here needs either combination.
reject with-interface all-of { 03:*:* 08:*:* }
reject with-interface all-of { 03:*:* 02:*:* }
reject with-interface all-of { 03:*:* e0:*:* }

# YubiKey 5 (OTP+FIDO+CCID), firmware 5.74 — not upgradable, so the hash is stable.
allow id 1050:0407 name "YubiKey OTP+FIDO+CCID" hash "2msOvGX5iCToX2LqCqPIO9H6KxlnnkuQgfKCOZkGzNg=" with-interface { 03:01:01 03:00:00 0b:00:00 }
