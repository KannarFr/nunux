# USBGuard rules that travel between machines. Live at /etc/usbguard/rules.d/
# (mode 0600, root — usbguard refuses anything looser). The per-host allowlist
# of built-in devices lives in /etc/usbguard/rules.conf, generated on each box
# by `usbguard generate-policy` and deliberately NOT tracked.
#
# Personal devices are pinned by descriptor hash + interface set, with no
# port/parent-hash, so they work in any port or dock on any host. id+name
# alone is exactly what a BadUSB would spoof. A device that reports a USB
# serial is pinned by it too; most here report none, so the hash is their
# only anchor. For a generic chip without serial (the Genesys hubs below) the
# hash is shared by every unit of that model: the rule admits any such hub,
# which is acceptable because a hub carries no HID/storage interface itself
# and each device behind it is still matched on its own. Add one with:
#   usbguard list-devices --blocked   # copy its hash, serial + with-interface

# BadUSB fingerprints: keyboard/HID combined with storage, CDC network, or
# wireless — no legitimate device here needs either combination.
reject with-interface all-of { 03:*:* 08:*:* }
reject with-interface all-of { 03:*:* 02:*:* }
reject with-interface all-of { 03:*:* e0:*:* }

# YubiKey 5 (OTP+FIDO+CCID), firmware 5.74 — not upgradable, so the hash is stable.
allow id 1050:0407 name "YubiKey OTP+FIDO+CCID" hash "2msOvGX5iCToX2LqCqPIO9H6KxlnnkuQgfKCOZkGzNg=" with-interface { 03:01:01 03:00:00 0b:00:00 }

# RØDE NT-USB mic + headphone out (UAC1 audio + HID for the mute/gain buttons).
allow id 19f7:0003 name "RODE NT-USB" hash "EOHbmktDRXsIHKWdbbhOFPbM2ULFx7XuTu6AnoNohHg=" with-interface { 01:01:00 01:02:00 01:02:00 01:02:00 01:02:00 03:00:00 }

# Logitech C922 webcam (UVC video + UAC mic).
allow id 046d:085c name "C922 Pro Stream Webcam" hash "DD+l3CJwc5ATSLoeu41Y+ws0ZhuUIsHfoICANl7nuUg=" with-interface { 0e:01:00 0e:02:00 0e:02:00 0e:02:00 0e:02:00 0e:02:00 0e:02:00 0e:02:00 0e:02:00 0e:02:00 0e:02:00 0e:02:00 0e:02:00 01:01:00 01:02:00 01:02:00 01:02:00 01:02:00 }

# USB-C dock: one Genesys hub that enumerates twice, its USB 3 half (0626) and
# its USB 2 half (0610, everything USB 2 plugged into the dock, the RØDE
# included, sits behind it: block it and those vanish), plus an ASIX AX88179B
# gigabit ethernet and a Genesys card reader.
allow id 05e3:0626 name "USB3.1 Hub" hash "15SBGsOo8K+JjtOKSCn7t0i6ifer4wmhzep1yEB5pLQ=" with-interface 09:00:00
allow id 05e3:0610 name "USB2.1 Hub" hash "CbRB9LX/JdGjNWCYSOcIwMVXE0UpOR03LCotWrTbuCM=" with-interface 09:00:00
allow id 0b95:1790 serial "006C1FF7CE6AFC" name "AX88179B" hash "knYKbWubLOpZMutVgyOjIdtDcPaKHQyfoRqeFQXHarc=" with-interface { ff:ff:00 02:0d:00 0a:00:01 0a:00:01 02:06:00 0a:00:00 0a:00:00 }
allow id 05e3:0749 serial "000000001536" name "USB3.0 Card Reader" hash "/rynW4gltAlW5Xk9rPdd0yvb60W53g8n7XDaspd1h1Y=" with-interface 08:06:50
