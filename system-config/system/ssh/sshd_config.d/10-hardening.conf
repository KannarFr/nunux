# Key-only SSH. Live at /etc/ssh/sshd_config.d/10-hardening.conf.
# sshd keeps the FIRST value it reads and includes this dir in lexical order,
# so the 10- prefix must sort before 20-systemd-userdb.conf and 99-archlinux.conf.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
