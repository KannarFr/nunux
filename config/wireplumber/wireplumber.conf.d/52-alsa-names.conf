# Friendly names for the built-in ALSA nodes (WirePlumber 0.5 SPA-JSON drop-in).
# Default description is "Ryzen HD Audio Controller Analog Stereo", which is
# what every mixer/picker shows; rename to "Laptop" so it reads next to the
# Bluetooth devices. Matched on the PCI node.name, which is stable for the
# onboard codec; the description (not the name) is what UIs display.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_65_00.6.analog-stereo" }
    ]
    actions = {
      update-props = {
        node.description = "Laptop"
        node.nick        = "Laptop"
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_input.pci-0000_65_00.6.analog-stereo" }
    ]
    actions = {
      update-props = {
        node.description = "Laptop Mic"
        node.nick        = "Laptop Mic"
      }
    }
  }
]
