# Noise-suppressed virtual mic on top of the RØDE NT-USB (RNNoise LADSPA via
# PipeWire's filter-chain). Shows up as a separate source to pick in Teams web,
# which has no noise suppression of its own; the raw mic stays available.
# Needs the `noise-suppression-for-voice` package. `nofail` is load-bearing:
# without it a missing plugin (fresh box, package not yet installed) makes
# pipewire itself refuse to start, taking all audio down with it.
# Stereo on purpose, though a voice is mono: a mono source gets linked to the
# left channel only of a stereo consumer (pw-record, a browser asking for two
# channels), i.e. sound in one ear. Matching the raw mic's FL/FR avoids that.
# target.object pins the capture side to the RØDE; with the mic unplugged the
# filter falls back to the default source instead of disappearing.
# Two settings live outside this file and must be redone on a rebuild
# (2026-10-16, after "your mic is bad" on Discord/Meet): make this source
# the default (`wpctl set-default <id of rnnoise_source>`, otherwise apps on
# "Default" got the C922 webcam mic), and set the RØDE's hardware gain to
# +12 dB (`amixer -c <card> cset numid=6 20,20`; it was +3 dB, so speech sat
# near the VAD threshold and word starts got gated). Also keep Discord's own
# noise suppression off: stacked on RNNoise it makes the voice robotic.
context.modules = [
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "RØDE NT-USB (noise cancelled)"
      media.name       = "RØDE NT-USB (noise cancelled)"
      filter.graph = {
        nodes = [
          { type   = ladspa
            name   = rnnoise
            plugin = /usr/lib/ladspa/librnnoise_ladspa.so
            label  = noise_suppressor_stereo
            control = {
              # Raise towards 80-95 if noise leaks between words; lower if
              # the start of words gets clipped.
              "VAD Threshold (%)"     = 50.0
              "VAD Grace Period (ms)" = 200
            }
          }
        ]
      }
      capture.props = {
        node.name     = "capture.rnnoise_source"
        node.passive  = true
        audio.rate    = 48000
        audio.position = [ FL FR ]
        target.object = "alsa_input.usb-RODE_Microphones_RODE_NT-USB-00.analog-stereo"
      }
      playback.props = {
        node.name   = "rnnoise_source"
        media.class = Audio/Source
        audio.rate  = 48000
        audio.position = [ FL FR ]
      }
    }
  }
]
