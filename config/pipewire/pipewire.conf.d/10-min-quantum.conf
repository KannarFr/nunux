# Never run the graph faster than 1024 samples (21 ms at 48 kHz).
# Apps ask for small quanta (Firefox 900, others 256 = 5.3 ms) and the graph
# follows the smallest request; under a heavy build (load ~22, 2026-10-16)
# Spotify and Firefox missed thousands of cycles at 256 and the RØDE's
# headphone jack played bursts of white noise. 21 ms of latency is inaudible
# for music and calls. Live equivalent, no restart:
#   pw-metadata -n settings 0 clock.min-quantum 1024
context.properties = {
  default.clock.min-quantum = 1024
}
